name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quoteflow_test
          POSTGRES_USER: quoteflow
          POSTGRES_PASSWORD: quoteflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quoteflow -d quoteflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/quoteflow_test
      DATABASE_USERNAME: quoteflow
      DATABASE_PASSWORD: quoteflow
      JWT_SECRET: test-only-quoteflow-jwt-signing-secret-min-32-chars!!
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: ./mvnw -B test
      - name: Package
        run: ./mvnw -B -DskipTests package

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Production build
        run: npm run build
