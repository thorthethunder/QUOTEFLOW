# Production profile. Requires environment/secret-managed credentials.
# Usage: --spring.profiles.active=prod
#
# CRITICAL: Do not use development defaults. Missing DATABASE_* / JWT_SECRET must fail startup.
# Application must not connect as postgres/root/superuser.

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  # Railway and many PaaS inject PORT. Prefer PORT, then SERVER_PORT, then 8080.
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0
  shutdown: graceful
  # Trust X-Forwarded-* only from the platform edge/load balancer that overwrites client headers.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    group:
      liveness:
        include: ping
      readiness:
        include: db

quoteflow:
  security:
    jwt:
      # No default — ProductionSecurityValidator fails if missing/weak.
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:quoteflow}
      audience: ${JWT_AUDIENCE:quoteflow-api}
    cors:
      # Explicit origins only. Never use * with credentials.
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    refresh-cookie:
      secure: true
      same-site: Lax
      return-in-body: false
  billing:
    enabled: ${BILLING_ENABLED:false}
    provider: ${BILLING_PROVIDER:RAZORPAY}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      pro-monthly-plan-id: ${RAZORPAY_PRO_MONTHLY_PLAN_ID:}
      pro-annual-plan-id: ${RAZORPAY_PRO_ANNUAL_PLAN_ID:}
      business-monthly-plan-id: ${RAZORPAY_BUSINESS_MONTHLY_PLAN_ID:}
  email:
    # Production must use RESEND (or EMAIL_ALLOW_DEV_PROVIDER=true for isolated staging only).
    provider: ${EMAIL_PROVIDER:RESEND}
    from-email: ${EMAIL_FROM:}
    from-name: ${EMAIL_FROM_NAME:QuoteFlow}
    worker-enabled: ${EMAIL_WORKER_ENABLED:true}
    worker-batch-size: ${EMAIL_WORKER_BATCH_SIZE:20}
    worker-interval: ${EMAIL_WORKER_INTERVAL:5s}
    claim-lease: ${EMAIL_CLAIM_LEASE:10m}
    resend:
      api-key: ${RESEND_API_KEY:}
  ai:
    # Production default remains disabled. Enabling requires explicit operator config.
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:OLLAMA}
    log-prompts: false
    ollama:
      base-url: ${OLLAMA_BASE_URL:}
      model: ${OLLAMA_MODEL:}
      connect-timeout: ${OLLAMA_CONNECT_TIMEOUT:5s}
      read-timeout: ${OLLAMA_READ_TIMEOUT:120s}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.quoteflow: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
