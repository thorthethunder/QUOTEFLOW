# Local development only. Production PostgreSQL must not be publicly exposed;
# use private networking and least-privileged application credentials.
services:
  postgres:
    image: postgres:16-alpine
    container_name: quoteflow-postgres
    restart: unless-stopped
    ports:
      # Host binding is for local developer machines only.
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quoteflow}
      POSTGRES_USER: ${POSTGRES_USER:-quoteflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quoteflow}
    volumes:
      - quoteflow_pgdata:/var/lib/postgresql/data
      # Creates quoteflow_test on first volume init only (local integration tests).
      - ./backend/src/main/resources/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quoteflow} -d ${POSTGRES_DB:-quoteflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional local Ollama — does NOT start with plain `docker compose up`.
  # Usage: docker compose --profile ai up -d
  # Models are NOT auto-pulled. On the host (or exec into the container):
  #   ollama pull qwen3:8b
  # Host Spring Boot: OLLAMA_BASE_URL=http://localhost:11434
  # App container on same compose network: OLLAMA_BASE_URL=http://ollama:11434
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    container_name: quoteflow-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - quoteflow_ollama:/root/.ollama

volumes:
  quoteflow_pgdata:
  quoteflow_ollama:
