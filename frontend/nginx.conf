worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	access_log /dev/stdout combined;
	sendfile on;
	server_tokens off;
	client_max_body_size 2m;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	upstream quoteflow_backend {
		server backend:8080;
	}

	server {
		listen 8080;
		server_name _;
		root /usr/share/nginx/html;
		index index.html;

		# Aligned with Phase 14 SPA CSP (Razorpay checkout allowlisted).
		add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com;" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
		add_header X-Frame-Options "DENY" always;

		# API must never fall through to SPA index.html.
		location /api/ {
			proxy_pass http://quoteflow_backend;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host $host;
			proxy_connect_timeout 5s;
			proxy_read_timeout 60s;
		}

		location /actuator/ {
			proxy_pass http://quoteflow_backend;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# Hashed Angular assets — long cache.
		location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
			expires 7d;
			add_header Cache-Control "public, max-age=604800, immutable";
			try_files $uri =404;
		}

		# SPA entry — do not cache forever.
		location = /index.html {
			add_header Cache-Control "no-cache, no-store, must-revalidate";
			try_files $uri =404;
		}

		location / {
			try_files $uri $uri/ /index.html;
		}
	}
}
