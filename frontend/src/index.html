<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>QuoteFlow</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Browser CSP for the Angular SPA. API responses use a tighter CSP (default-src 'none').
      Razorpay Checkout script/frame origins are allowlisted only when billing checkout is used.
      style-src includes 'unsafe-inline' for Angular Material; tighten with nonces in a later hardening pass if needed.
      connect-src 'self' supports same-origin /api proxy (Pages → Railway).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com;"
    />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
